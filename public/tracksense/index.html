<body>

<a class="skip" href="#main">Skip to content</a>

<header class="site-header" id="siteHeader">
  <a class="wordmark serif" href="/">A Personal Workshop</a>
  <nav class="site-nav" aria-label="Primary">
    <a href="/#work">Work</a>
    <a href="/#about">About</a>
    <a class="btn btn--sm" href="/thrennel/">Thrennel beta</a>
  </nav>
</header>

<main id="main">

  <section class="band" data-appwin-body>
    <p class="band__crumb page-only"><a href="/#work">← All projects</a></p>
    <div class="band__head">
      <h1 id="tracksenseTitle">What TrackSense tells you</h1>
      <span class="stamp" id="lapStamp"></span>
    </div>
    <p class="band__note"><span id="lapSummary"></span> Hover the replay to scrub it; tap a corner below for the coaching.</p>
    <div class="ts-stage" id="tsStage"></div>
    <div class="chart-wrap">
      <div class="chart">
        <div class="chart__plot" id="plot" role="group" aria-label="Time lost per corner"></div>
        <div class="chart__labels" id="plotLabels"></div>
      </div>
      <aside class="readout" aria-label="Corner coaching" aria-live="polite">
        <span class="readout__k" id="roName"></span>
        <span class="readout__v serif" id="roDelta"></span>
        <p class="readout__note" id="roNote"></p>
        <div class="readout__meta">
          <span id="roLap"></span>
          <span id="roTotal"></span>
        </div>
      </aside>
    </div>
  </section>

  <nav class="more" aria-label="Other projects">
    <span class="kicker">More from the workshop</span>
    <div class="more__links">
      <a href="/thrennel/">Thrennel →</a>
